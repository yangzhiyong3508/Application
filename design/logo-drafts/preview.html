<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDOG Logo Drafts</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f4f5f7;
      color: #1f2328;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 700;
    }

    p {
      margin: 0 0 28px;
      color: #667085;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
      max-width: 1280px;
    }

    .item {
      background: #fff;
      border: 1px solid #e4e7ec;
      border-radius: 8px;
      padding: 18px;
    }

    .item img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      border-radius: 24%;
      background: #fff;
    }

    .name {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 650;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>EDOG Logo Drafts</h1>
  <p>5 个极简方向稿，均为可编辑 SVG。</p>
  <main class="grid">
    <section class="item">
      <img src="edog-logo-01-line-dog.svg" alt="线条小狗">
      <div class="name">01 线条小狗</div>
    </section>
    <section class="item">
      <img src="edog-logo-02-face-wave.svg" alt="狗脸声波">
      <div class="name">02 狗脸声波</div>
    </section>
    <section class="item">
      <img src="edog-logo-03-soundmark.svg" alt="抽象声纹">
      <div class="name">03 抽象声纹</div>
    </section>
    <section class="item">
      <img src="edog-logo-04-app-icon.svg" alt="圆角图标">
      <div class="name">04 圆角图标</div>
    </section>
    <section class="item">
      <img src="edog-logo-05-one-stroke.svg" alt="单线耳朵">
      <div class="name">05 单线耳朵</div>
    </section>
  </main>
</body>
</html>
