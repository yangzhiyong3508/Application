<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDOG Solid Logo Drafts</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f4f5f7;
      color: #1f2328;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 700;
    }

    p {
      margin: 0 0 28px;
      color: #667085;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
      max-width: 1280px;
    }

    .item {
      background: #fff;
      border: 1px solid #e4e7ec;
      border-radius: 8px;
      padding: 18px;
    }

    .item img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      border-radius: 24%;
      background: #fff;
    }

    .name {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 650;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>EDOG Solid Logo Drafts</h1>
  <p>5 个“面形”方向稿，主体由实心色块和负空间组成。</p>
  <main class="grid">
    <section class="item">
      <img src="edog-solid-01-dog-bubble.svg" alt="狗脸气泡">
      <div class="name">01 狗脸气泡</div>
    </section>
    <section class="item">
      <img src="edog-solid-02-side-signal.svg" alt="侧脸声波">
      <div class="name">02 侧脸声波</div>
    </section>
    <section class="item">
      <img src="edog-solid-03-negative-wave.svg" alt="负形声波">
      <div class="name">03 负形声波</div>
    </section>
    <section class="item">
      <img src="edog-solid-04-soft-mascot.svg" alt="柔和头像">
      <div class="name">04 柔和头像</div>
    </section>
    <section class="item">
      <img src="edog-solid-05-minimal-badge.svg" alt="极简徽章">
      <div class="name">05 极简徽章</div>
    </section>
  </main>
</body>
</html>
