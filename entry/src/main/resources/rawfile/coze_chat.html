<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>Coze Chat 固定尺寸</title>
  <style>
    html, body {
      width: 126px;    /* 页面宽度 */
      height: 272px;   /* 页面高度 */
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* 聊天容器与 body 同步大小 */
    #chat-container {
      width: 100%;
      height: 100%;
    }

    /* 聊天框自动填充容器 */
    .coze-chatbot, .coze-chatbot iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
<div id="chat-container"></div>

<!-- 引入 Coze SDK（建议使用稳定版本） -->
<script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0/dist/umd/index.js"></script>

<script>
  // 初始化 Coze 聊天客户端
  window.addEventListener('DOMContentLoaded', () => {
    const client = new CozeWebSDK.WebChatClient({
      config: { type: 'bot', bot_id: '7534905232841785370', isIframe: false },
      auth: {
        type: 'token',
        token: 'sat_LeDY8iu23Ifcb2UwY7LXfZeL0HhoF4NTswQmlooFVJyRJNd7ExEk9gFogjnRPbPl',
        onRefreshToken: async () =>
          'sat_LeDY8iu23Ifcb2UwY7LXfZeL0HhoF4NTswQmlooFVJyRJNd7ExEk9gFogjnRPbPl',
      },
      userInfo: {
        id: 'user',
        url: 'https://lf-coze-web-cdn.coze.cn/obj/eden-cn/lm-lgvj/ljhwZthlaukjlkulzlp/coze/coze-logo.png',
        nickname: 'User',
      },
      ui: {
        base: { layout: 'pc', lang: 'zh-CN', zIndex: 1000 },
        header: { isShow: false, isNeedClose: false },
        asstBtn: { isNeed: false },
        footer: { isShow: false },
        chatBot: { title: 'Coze Bot', uploadable: false, width: '100%', el: '#chat-container' },
      },
    });

    // 立即显示聊天框
    client.showChatBot();
  });
</script>
</body>
</html>
